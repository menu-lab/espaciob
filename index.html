<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Espacio B - Hair Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* Contenedor responsivo fijo en proporción 900x1700 */
    .app-container {
      position: relative;
      width: 100vw;
      height: calc(100vw * (1700 / 900));
      max-height: 100vh;
      max-width: calc(100vh * (900 / 1700));
      aspect-ratio: 900 / 1700;
      background: url('menugeneral.jpg') no-repeat center center;
      background-size: 100% 100%;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    /* Brillo dorado interactivo común */
    .shimmer-btn {
      position: absolute;
      display: block;
      cursor: pointer;
      text-decoration: none;
      border-radius: 16px;
      overflow: hidden;
    }

    .shimmer-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -150%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        60deg,
        rgba(255, 255, 255, 0) 30%,
        rgba(218, 165, 32, 0.35) 50%,
        rgba(255, 255, 255, 0) 70%
      );
      transform: rotate(25deg);
      animation: flash-sheen 4.5s infinite ease-in-out;
    }

    @keyframes flash-sheen {
      0%, 70% { left: -150%; }
      100% { left: 150%; }
    }

    /* Destello sutil en el Logo superior */
    .logo-glow {
      position: absolute;
      top: 1%;
      left: 17.5%;
      width: 65%;
      height: 17%;
      pointer-events: none;
      overflow: hidden;
      border-radius: 12px;
    }

    .logo-glow::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0),
        rgba(255, 215, 0, 0.3),
        rgba(255, 255, 255, 0)
      );
      transform: skewX(-25deg);
      animation: logo-sweep 5s infinite 1s ease-in-out;
    }

    @keyframes logo-sweep {
      0%, 75% { left: -100%; }
      100% { left: 160%; }
    }

    /* Botón de Sonido (icono parlante superior izquierdo) */
    #soundToggle {
      position: absolute;
      top: 2.2%;
      left: 3.5%;
      width: 10%;
      height: 5.5%;
      cursor: pointer;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sound-badge {
      font-size: 1.1rem;
      transition: transform 0.2s ease, opacity 0.2s;
      opacity: 0.85;
    }

    .muted .sound-badge {
      filter: grayscale(1) opacity(0.5);
    }

    /* Coordenadas precisas de la botonera */
    .btn-agendamiento {
      top: 43.5%;
      left: 7%;
      width: 82%;
      height: 9.2%;
    }

    .btn-whatsapp {
      top: 56.5%;
      left: 7%;
      width: 82%;
      height: 9.2%;
    }

    .btn-instagram {
      top: 70.2%;
      left: 7%;
      width: 82%;
      height: 9.2%;
    }

    .btn-maps {
      top: 88.8%;
      left: 0%;
      width: 100%;
      height: 11.2%;
      border-radius: 0;
    }

    .shimmer-btn:active {
      transform: scale(0.985);
      background-color: rgba(212, 175, 55, 0.12);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Pista de audio -->
    <audio id="bgMusic" src="sonido.mp3" loop preload="auto"></audio>

    <!-- Destello superior sobre el logo -->
    <div class="logo-glow"></div>

    <!-- 1. Botón de Audio Interactivo -->
    <div id="soundToggle" class="muted" title="Activar/Desactivar Sonido">
      <span class="sound-badge">🔇</span>
    </div>

    <!-- 2. Botón Agendamiento (AgendaPro) -->
    <a href="https://agendapro.com/site/cl/espaciob" target="_blank" rel="noopener" class="shimmer-btn btn-agendamiento" title="Reserva tu Cita Online"></a>

    <!-- 3. Botón WhatsApp -->
    <a href="https://wa.me/56946862122?text=Hola,%20quisiera%20consultar%20por%20una%20atención%20en%20Espacio%20B" target="_blank" rel="noopener" class="shimmer-btn btn-whatsapp" title="WhatsApp Directo"></a>

    <!-- 4. Botón Instagram -->
    <a href="https://www.instagram.com/salon_espaciob" target="_blank" rel="noopener" class="shimmer-btn btn-instagram" title="Visita nuestro perfil de Instagram"></a>

    <!-- 5. Botón Footer Geolocalización (Google Maps) -->
    <a href="https://www.google.com/maps/search/?api=1&query=Av+Brasil+8018+local+2,+Renca" target="_blank" rel="noopener" class="shimmer-btn btn-maps" title="Cómo llegar a Espacio B"></a>
  </div>

  <script>
    const audio = document.getElementById('bgMusic');
    const soundToggle = document.getElementById('soundToggle');
    const badge = soundToggle.querySelector('.sound-badge');

    soundToggle.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => {
          soundToggle.classList.remove('muted');
          badge.textContent = '🔊';
        }).catch(err => {
          console.warn("Reproducción bloqueada por navegador:", err);
        });
      } else {
        audio.pause();
        soundToggle.classList.add('muted');
        badge.textContent = '🔇';
      }
    });
  </script>
</body>
</html>
