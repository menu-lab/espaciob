<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Espacio B - Hair Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Playfair Display', Georgia, serif;
    }

    .app-container {
      position: relative;
      width: 100vw;
      height: calc(100vw * (1700 / 900));
      max-height: 100vh;
      max-width: calc(100vh * (900 / 1700));
      aspect-ratio: 900 / 1700;
      background: url('menugeneral.jpg') no-repeat center center;
      background-size: 100% 100%;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    /* Brillo tenue continuo en el logo superior */
    .logo-glow {
      position: absolute;
      top: 1.5%;
      left: 18%;
      width: 64%;
      height: 16%;
      pointer-events: none;
      overflow: hidden;
      border-radius: 10px;
    }

    .logo-glow::after {
      content: '';
      position: absolute;
      top: 0;
      left: -120%;
      width: 35%;
      height: 100%;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 223, 128, 0.18) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: skewX(-20deg);
      animation: logo-sweep 7s infinite 2s ease-in-out;
    }

    @keyframes logo-sweep {
      0%, 75% { left: -120%; }
      100% { left: 160%; }
    }

    /* Botón de Sonido en esquina superior izquierda */
    #soundToggle {
      position: absolute;
      top: 2%;
      left: 3%;
      width: 11%;
      height: 6%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    #soundIcon {
      width: 65%;
      height: 65%;
      fill: #b38728;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    #soundToggle.muted #soundIcon {
      opacity: 0.4;
      filter: grayscale(1);
    }

    /* Botones interactivos transparentes con destello reactivo */
    .touch-btn {
      position: absolute;
      display: block;
      cursor: pointer;
      text-decoration: none;
      border-radius: 16px;
      overflow: hidden;
      background: transparent;
      z-index: 10;
    }

    .touch-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 235, 150, 0.6) 50%,
        rgba(255, 255, 255, 0.8) 75%,
        rgba(255, 255, 255, 0) 100%
      );
      opacity: 0;
      transform: skewX(-25deg);
    }

    .touch-btn:active::after {
      opacity: 1;
      left: 120%;
      transition: left 0.4s ease-out, opacity 0.1s ease-in;
    }

    .touch-btn:active {
      transform: scale(0.985);
      background-color: rgba(212, 175, 55, 0.12);
    }

    .btn-agendamiento {
      top: 43.5%;
      left: 7%;
      width: 82%;
      height: 9.2%;
    }

    .btn-whatsapp {
      top: 56.5%;
      left: 7%;
      width: 82%;
      height: 9.2%;
    }

    .btn-instagram {
      top: 70.2%;
      left: 7%;
      width: 82%;
      height: 9.2%;
    }

    .btn-maps {
      top: 88.8%;
      left: 0%;
      width: 100%;
      height: 11.2%;
      border-radius: 0;
    }

    /* Wincha de servicios en franja inferior */
    .services-ticker {
      position: absolute;
      top: 81.8%;
      left: 0;
      width: 100%;
      height: 4.8%;
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
      background: rgba(255, 255, 255, 0.88);
      border-top: 1px solid rgba(212, 175, 55, 0.4);
      border-bottom: 1px solid rgba(212, 175, 55, 0.4);
      backdrop-filter: blur(4px);
      z-index: 5;
    }

    .ticker-track {
      display: inline-flex;
      animation: marquee 24s linear infinite;
    }

    .ticker-item {
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #2b2623;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
    }

    .ticker-item span {
      color: #c59b27;
      margin-left: 16px;
      font-size: 0.75rem;
    }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <audio id="bgMusic" loop preload="auto"></audio>

    <div class="logo-glow"></div>

    <!-- Botón de Audio con SVG dorado -->
    <div id="soundToggle" class="muted" title="Control de Sonido">
      <svg id="soundIcon" viewBox="0 0 24 24">
        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
      </svg>
    </div>

    <!-- Botones táctiles -->
    <a href="https://agendapro.com/site/cl/espaciob/553829" target="_blank" rel="noopener" class="touch-btn btn-agendamiento" title="Reserva tu Cita Online"></a>
    <a href="https://wa.me/56946862122?text=Hola,%20quisiera%20consultar%20por%20una%20atenci%C3%B3n%20en%20Espacio%20B" target="_blank" rel="noopener" class="touch-btn btn-whatsapp" title="WhatsApp Directo"></a>
    <a href="https://www.instagram.com/salon_espaciob" target="_blank" rel="noopener" class="touch-btn btn-instagram" title="Visita nuestro perfil de Instagram"></a>

    <!-- Wincha animada de servicios continuos -->
    <div class="services-ticker">
      <div class="ticker-track">
        <div class="ticker-item">Balayage & Babylights <span>✦</span></div>
        <div class="ticker-item">Corte Dama & Varón <span>✦</span></div>
        <div class="ticker-item">Botox Capilar & Alisados <span>✦</span></div>
        <div class="ticker-item">Manicura Rusa & Acrílicas <span>✦</span></div>
        <div class="ticker-item">Lifting de Pestañas <span>✦</span></div>
        <div class="ticker-item">Tratamientos Hidratantes <span>✦</span></div>
        <!-- Duplicado para loop fluido infinito -->
        <div class="ticker-item">Balayage & Babylights <span>✦</span></div>
        <div class="ticker-item">Corte Dama & Varón <span>✦</span></div>
        <div class="ticker-item">Botox Capilar & Alisados <span>✦</span></div>
        <div class="ticker-item">Manicura Rusa & Acrílicas <span>✦</span></div>
        <div class="ticker-item">Lifting de Pestañas <span>✦</span></div>
        <div class="ticker-item">Tratamientos Hidratantes <span>✦</span></div>
      </div>
    </div>

    <!-- Footer Dirección y Mapa -->
    <a href="https://www.google.com/maps/search/?api=1&query=Av+Brasil+8018+local+2,+Renca" target="_blank" rel="noopener" class="touch-btn btn-maps" title="Cómo llegar a Espacio B"></a>
  </div>

  <script>
    const tracks = ['sonido1.mp3', 'sonido2.mp3'];
    const chosenTrack = tracks[Math.floor(Math.random() * tracks.length)];

    const audio = document.getElementById('bgMusic');
    audio.src = chosenTrack;

    const soundToggle = document.getElementById('soundToggle');
    const soundIcon = document.getElementById('soundIcon');

    const iconMuted = 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z';
    const iconActive = 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z';

    soundToggle.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => {
          soundToggle.classList.remove('muted');
          soundIcon.innerHTML = `<path d="${iconActive}"/>`;
        }).catch(err => {
          console.warn("Audio bloqueado:", err);
        });
      } else {
        audio.pause();
        soundToggle.classList.add('muted');
        soundIcon.innerHTML = `<path d="${iconMuted}"/>`;
      }
    });
  </script>
</body>
</html>
