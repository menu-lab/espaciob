<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Espacio B - Hair Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }

    .app-container {
      position: relative;
      width: 100vw;
      height: calc(100vw * (1700 / 900));
      max-height: 100vh;
      max-width: calc(100vh * (900 / 1700));
      aspect-ratio: 900 / 1700;
      background: url('menugeneral.jpg') no-repeat center center;
      background-size: 100% 100%;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    /* Brillo ultra sutil en el logo superior */
    .logo-glow {
      position: absolute;
      top: 1.5%;
      left: 18%;
      width: 64%;
      height: 16%;
      pointer-events: none;
      overflow: hidden;
      border-radius: 10px;
    }

    .logo-glow::after {
      content: '';
      position: absolute;
      top: 0;
      left: -120%;
      width: 35%;
      height: 100%;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 223, 128, 0.18) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: skewX(-20deg);
      animation: logo-sweep 7s infinite 2s ease-in-out;
    }

    @keyframes logo-sweep {
      0%, 75% { left: -120%; }
      100% { left: 160%; }
    }

    /* Botón de Sonido superior izquierdo */
    #soundToggle {
      position: absolute;
      top: 2.2%;
      left: 3.5%;
      width: 10%;
      height: 5.5%;
      cursor: pointer;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .sound-badge {
      font-size: 1.1rem;
      transition: opacity 0.2s ease;
      opacity: 0.85;
    }

    .muted .sound-badge {
      filter: grayscale(1) opacity(0.45);
    }

    /* Botones invisibles limpios (sin destellos ni brillos) */
    .touch-btn {
      position: absolute;
      display: block;
      cursor: pointer;
      text-decoration: none;
      border-radius: 16px;
      background: transparent;
    }

    .touch-btn:active {
      background-color: rgba(212, 175, 55, 0.08);
      transform: scale(0.99);
    }

    /* Posiciones sobre menugeneral.jpg */
    .btn-agendamiento {
      top: 43.5%;
      left: 7%;
      width: 82%;
      height: 9.2%;
    }

    .btn-whatsapp {
      top: 56.5%;
      left: 7%;
      width: 82%;
      height: 9.2%;
    }

    .btn-instagram {
      top: 70.2%;
      left: 7%;
      width: 82%;
      height: 9.2%;
    }

    .btn-maps {
      top: 88.8%;
      left: 0%;
      width: 100%;
      height: 11.2%;
      border-radius: 0;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Pista de audio cargada dinámicamente -->
    <audio id="bgMusic" loop preload="auto"></audio>

    <div class="logo-glow"></div>

    <div id="soundToggle" class="muted" title="Activar/Desactivar Sonido">
      <span class="sound-badge">🔇</span>
    </div>

    <!-- 1. Agendamiento -->
    <a href="https://agendapro.com/site/cl/espaciob/553829" target="_blank" rel="noopener" class="touch-btn btn-agendamiento" title="Reserva tu Cita Online"></a>

    <!-- 2. WhatsApp -->
    <a href="https://wa.me/56946862122?text=Hola,%20quisiera%20consultar%20por%20una%20atenci%C3%B3n%20en%20Espacio%20B" target="_blank" rel="noopener" class="touch-btn btn-whatsapp" title="WhatsApp Directo"></a>

    <!-- 3. Instagram -->
    <a href="https://www.instagram.com/salon_espaciob" target="_blank" rel="noopener" class="touch-btn btn-instagram" title="Visita nuestro perfil de Instagram"></a>

    <!-- 4. Footer Dirección y Mapa -->
    <a href="https://www.google.com/maps/search/?api=1&query=Av+Brasil+8018+local+2,+Renca" target="_blank" rel="noopener" class="touch-btn btn-maps" title="Cómo llegar a Espacio B"></a>
  </div>

  <script>
    const playlist = ['sonido1.mp3', 'sonido2.mp3'];
    const selectedTrack = playlist[Math.floor(Math.random() * playlist.length)];

    const audio = document.getElementById('bgMusic');
    audio.src = selectedTrack;

    const soundToggle = document.getElementById('soundToggle');
    const badge = soundToggle.querySelector('.sound-badge');

    soundToggle.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => {
          soundToggle.classList.remove('muted');
          badge.textContent = '🔊';
        }).catch(err => {
          console.warn("Reproducción bloqueada por navegador:", err);
        });
      } else {
        audio.pause();
        soundToggle.classList.add('muted');
        badge.textContent = '🔇';
      }
    });
  </script>
</body>
</html>
